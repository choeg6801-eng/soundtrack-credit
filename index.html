body{margin:0}

<style>
body{margin:0}
@media (max-width: 640px){.rc-grid{gap:6px !important}.rc-grid [style*="height: 148px"]{height:96px !important}}
</style>
<style>
body{margin:0;background:#0A0907}
a{color:#E9B04A}a:hover{color:#F6CF84}
.fx-root{word-break:keep-all;overflow-wrap:break-word}
@keyframes fxRoll{from{transform:translateY(0)}to{transform:translateY(-50%)}}
.fx-roll{animation:fxRoll 30s linear infinite}
.fx-fade{transition:background-color .6s ease,color .6s ease,border-color .6s ease}
@keyframes fxEq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.fx-eq span{display:block;width:3px;height:14px;border-radius:2px;transform-origin:bottom;transform:scaleY(.35)}
.fx-eq.on span{animation:fxEq .9s ease-in-out infinite}
.fx-eq.on span:nth-child(2){animation-delay:.2s}.fx-eq.on span:nth-child(3){animation-delay:.45s}.fx-eq.on span:nth-child(4){animation-delay:.1s}
.fx-menu-btn{display:none !important}
.fx-navbar > a,.fx-links > a{display:inline-flex;align-items:center;min-height:44px}
@media (prefers-reduced-motion: reduce){.fx-roll{animation:none}.fx-fade{transition:none}.fx-eq.on span{animation:none;transform:scaleY(.7)}}
@media (max-width: 1080px){
  .fx-links{display:none !important}
  .fx-links.fx-open{display:flex !important;flex-basis:100%;flex-direction:column;align-items:stretch !important;gap:6px !important;padding:8px 4px 4px}
  .fx-links.fx-open a{padding:12px 8px}
  .fx-menu-btn{display:inline-flex !important}
  .fx-navbar{border-radius:24px !important}
}
@media (max-width: 640px){
  .fx-root section,.fx-root header{padding-left:16px !important;padding-right:16px !important}
  .fx-root section{padding-top:72px !important;padding-bottom:72px !important}
  .fx-root section.fx-tight{padding-top:40px !important;padding-bottom:0 !important}
  .fx-root section.fx-flush{padding:0 !important}
  .fx-stage{height:auto !important;display:flex;flex-direction:column;gap:14px}
  .fx-stage > *{position:static !important;width:100% !important;max-width:none !important;box-sizing:border-box;transform:none !important}
  .fx-deco{display:none !important}
  .fx-shows{grid-template-columns:repeat(5,104px) !important;overflow-x:auto;padding-bottom:6px}
  .fx-panel{padding:20px !important;min-height:0 !important}
  .fx-gap{gap:40px !important}
  .fx-bgm-sub{display:none !important}
}
</style>
<style>
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
section[id],footer[id]{scroll-margin-top:96px}
